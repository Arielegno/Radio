name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas del motor de audio
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Revisión (lint)
        run: gradle lintDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudioMusical-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/
            app/build/test-results/
