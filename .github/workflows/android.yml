# Compila la app de Android (carpeta android/ o el archivo radio-android.zip) y publica el APK en «Releases».
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - 'revista-kmp/composeApp/src/commonMain/**'
      - 'radio-android.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # Si subiste el proyecto como radio-android.zip (más fácil desde el celular), aquí se descomprime.
      - name: Descomprimir el proyecto
        working-directory: .
        run: |
          if [ -f radio-android.zip ]; then rm -rf android && unzip -q -o radio-android.zip; fi
          test -f android/settings.gradle.kts || { echo "No encuentro la carpeta android/ ni radio-android.zip"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Motor de voces propias (sherpa-onnx, licencia Apache 2.0)
      - name: Motor de voz
        run: mkdir -p app/libs && curl -fsSL --retry 4 -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar

      # Letras de la Revista nativa dentro del APK (así abre rápido y sin internet la primera vez)
      - name: Letras de la Revista
        working-directory: .
        run: bash revista-kmp/fuentes.sh android/app/src/main/assets/revista_fonts || true

      - name: Pruebas de la lógica
        run: set -o pipefail; gradle --no-daemon testDebugUnitTest 2>&1 | tee ../registro.txt

      - name: Compilar el APK
        run: set -o pipefail; gradle --no-daemon assembleRelease 2>&1 | tee -a ../registro.txt

      # Si algo falla, el registro queda público en Releases (para poder corregirlo).
      - name: Publicar el registro de errores
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |^w: .*error|What went wrong|FAILED|> " registro.txt | head -80 | while IFS= read -r l; do echo "::error::$l"; done || true
          gh release view android-registro --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-registro --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Registro de compilación" --notes "Registro de la última compilación fallida."
          gh release upload android-registro registro.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Preparar el APK
        run: cp app/build/outputs/apk/release/app-release.apk radio-de-ruta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radio-de-ruta-apk
          path: android/radio-de-ruta.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Radio de ruta para Android" \
              --notes "Descarga radio-de-ruta.apk desde tu celular Android e instálala. Se actualiza sola cada vez que cambia el código."
          gh release upload android radio-de-ruta.apk --repo "$GITHUB_REPOSITORY" --clobber
