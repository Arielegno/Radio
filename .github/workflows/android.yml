name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pruebas del motor de audio
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Revisión (lint)
        run: gradle lintDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: EstudioMusical-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Publicar APK en la rama estudio-musical-apk
        if: github.ref == 'refs/heads/estudio-musical'
        run: |
          mkdir /tmp/apk && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk/EstudioMusical.apk
          cd /tmp/apk
          echo "APK de la versión ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" > LEEME.txt
          git init -q -b estudio-musical-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" estudio-musical-apk
