# Compila el APK de Hilo y lo prueba en emuladores de Android.
# "Hilo-apk" es el instalable. Las capturas de la prueba quedan en la rama hilo-capturas.
name: Compilar y probar APK

on:
  push:
    branches: [hilo-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hilo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar el APK en la rama hilo-apk
        run: |
          mkdir -p /tmp/apk && cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk/Hilo.apk
          cd /tmp/apk
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Hilo.apk"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" main:hilo-apk

  # Depuración: revisión del código con Android Lint y pruebas de la lógica (leyes, autores, citas, repaso)
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de la lógica
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon -i | grep -E "Libro de|PASSED|FAILED|tests completed" || true
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon || true
      - name: Publicar informes
        if: always()
        run: |
          mkdir -p /tmp/rev
          cp app/build/reports/lint.txt /tmp/rev/ 2>/dev/null || true
          cp -r app/build/reports/tests /tmp/rev/tests 2>/dev/null || true
          cp -r app/build/test-results /tmp/rev/test-results 2>/dev/null || true
          cd /tmp/rev
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Revisión" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" main:hilo-revision

  # Estrés: documentos enormes, 5000 tarjetas, giros, 8000 toques al azar, memoria y modo estricto
  estres:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hilo-apk
          path: app/build/outputs/apk/debug/
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba de estrés en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: timeout 4200 bash .github/test/estres.sh
      - name: Publicar resultados
        if: always()
        run: |
          mkdir -p /tmp/est && cp -r shots/. /tmp/est/ 2>/dev/null || true
          cd /tmp/est
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Estrés" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" main:hilo-estres

  probar:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hilo-apk
          path: app/build/outputs/apk/debug/
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador (Android API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: timeout 1200 bash .github/test/smoke.sh
      - name: Publicar capturas
        if: always()
        run: |
          mkdir -p /tmp/cap && cp -r shots/. /tmp/cap/ 2>/dev/null || true
          cd /tmp/cap
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Capturas API ${{ matrix.api }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" main:hilo-capturas-${{ matrix.api }}
