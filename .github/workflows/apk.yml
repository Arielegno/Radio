# Compila el APK de Hilo en GitHub, sin instalar Android Studio.
# Sube este proyecto a un repositorio de GitHub; en la pestaña "Actions"
# abre la última ejecución y descarga "Hilo-apk".
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hilo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
