# Prueba de estrés: la app en un teléfono virtual de Android, usada a lo loco por un probador automático («monkey»).
# Solo se corre a mano (Actions › Prueba de estrés › Run workflow). El resultado queda en Releases › «estres».
name: Prueba de estrés

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estres:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Motor de voz y letras
        run: |
          mkdir -p android/app/libs && curl -fsSL --retry 4 -o android/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          bash revista-kmp/fuentes.sh android/app/src/main/assets/revista_fonts || true

      - name: Compilar la versión de prueba (igual a la normal, con R8)
        working-directory: android
        run: gradle --no-daemon assembleEstres -PabiExtra=x86_64

      - name: Canciones de prueba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 android/estres/semilla.py "$RUNNER_TEMP/semilla"

      - name: Activar la aceleración del teléfono virtual
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Usar la app a lo loco
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/estres/prueba.sh android/app/build/outputs/apk/estres/app-estres.apk "$RUNNER_TEMP/semilla" "$GITHUB_WORKSPACE/estres-resultado"

      - name: Guardar el resultado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd estres-resultado 2>/dev/null || exit 0
          (cat resumen.txt; echo; grep -h -E "CRASH|NOT RESPONDING|Events injected" monkey-*.txt) > leeme.txt || true
          zip -q ../estres.zip *.txt
          gh release view estres >/dev/null 2>&1 || gh release create estres --target "$GITHUB_SHA" --prerelease --title "Prueba de estrés" --notes "Resultado de la última prueba de estrés automática."
          gh release upload estres ../estres.zip leeme.txt --clobber
