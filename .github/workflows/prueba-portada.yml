# Prueba en un teléfono virtual: la portada propia de las playlists. Resultado en Releases › «prueba-portada».
name: Prueba de portada de playlists

on:
  workflow_dispatch:
  push:
    branches: [kotlin]
    paths:
      - 'android/pruebas/portada_playlist.py'
      - '.github/workflows/prueba-portada.yml'

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Motor de voz y letras
        run: |
          mkdir -p android/app/libs && curl -fsSL --retry 4 -o android/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          bash revista-kmp/fuentes.sh android/app/src/main/assets/revista_fonts || true
      - name: Compilar la app de prueba
        working-directory: android
        run: gradle --no-daemon assembleEstres -PabiExtra=x86_64
      - name: Canciones de prueba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 android/estres/semilla.py "$RUNNER_TEMP/semilla"
      - name: Activar la aceleración del teléfono virtual
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar la portada
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 android/pruebas/portada_playlist.py android/app/build/outputs/apk/estres/app-estres.apk "$RUNNER_TEMP/semilla" "$GITHUB_WORKSPACE/resultado"
      - name: Guardar el resultado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd resultado 2>/dev/null || exit 0
          zip -q ../prueba-portada.zip *.png *.txt
          gh release view prueba-portada >/dev/null 2>&1 || gh release create prueba-portada --target "$GITHUB_SHA" --prerelease --title "Prueba de portada de playlists" --notes "Capturas y resultado de la prueba en el teléfono virtual."
          gh release upload prueba-portada ../prueba-portada.zip leeme.txt --clobber
