# Prueba en un teléfono virtual: todas las voces de Luna y sus funciones, y un recorrido por todas las pantallas.
# Resultado (capturas, audios para escuchar y el informe) en Releases › «prueba-voces».
name: Prueba de voces y pantallas

on:
  workflow_dispatch:
  push:
    branches: [kotlin]
    paths:
      - 'android/pruebas/voces.py'
      - 'android/pruebas/pantallas.py'
      - 'android/pruebas/telefono.py'
      - '.github/workflows/prueba-voces.yml'

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Motor de voz y letras
        run: |
          mkdir -p android/app/libs && curl -fsSL --retry 4 -o android/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          bash revista-kmp/fuentes.sh android/app/src/main/assets/revista_fonts || true
      - name: Compilar la app de prueba
        working-directory: android
        run: gradle --no-daemon assembleEstres -PabiExtra=x86_64
      - name: Canciones y voz de prueba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy
          python3 android/estres/semilla.py "$RUNNER_TEMP/semilla"
          mkdir -p "$RUNNER_TEMP/ald" && curl -fsSL --retry 4 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_MX-ald-medium.tar.bz2 | tar -xj -C "$RUNNER_TEMP/ald"
      - name: Activar la aceleración del teléfono virtual
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cd android/pruebas && python3 pantallas.py ../app/build/outputs/apk/estres/app-estres.apk "$RUNNER_TEMP/semilla" "$GITHUB_WORKSPACE/resultado/pantallas" || true
            cd android/pruebas && python3 voces.py ../app/build/outputs/apk/estres/app-estres.apk "$RUNNER_TEMP/semilla" "$GITHUB_WORKSPACE/resultado/voces" "$RUNNER_TEMP/ald" || true
      - name: Guardar el resultado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd resultado 2>/dev/null || exit 0
          (cat voces/leeme.txt 2>/dev/null; echo; echo; cat pantallas/leeme.txt 2>/dev/null) > leeme.txt
          zip -qr ../pantallas.zip pantallas -x '*.wav'
          zip -qr ../voces.zip voces -x '*.wav' -x '*/logcat.txt'
          gh release view prueba-voces >/dev/null 2>&1 || gh release create prueba-voces --target "$GITHUB_SHA" --prerelease --title "Prueba de voces y pantallas" --notes "Capturas, audios y resultado de la prueba en el teléfono virtual."
          gh release upload prueba-voces ../pantallas.zip ../voces.zip leeme.txt voces/escuchar-*.mp3 --clobber || gh release upload prueba-voces ../pantallas.zip ../voces.zip leeme.txt --clobber
