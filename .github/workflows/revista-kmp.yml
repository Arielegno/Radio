# Compila la Revista nativa (Kotlin + Compose Multiplatform) para el navegador, saca capturas y la publica en la web (carpeta revista-nativa/ de main).
name: Revista nativa

on:
  push:
    branches: [kotlin]
    paths:
      - 'revista-kmp/**'
      - '.github/workflows/revista-kmp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revista-kmp
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: revista-kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Letras (Google Fonts, licencia OFL)
        run: bash fuentes.sh composeApp/src/wasmJsMain/resources/fonts

      - name: Compilar para el navegador
        run: set -o pipefail; gradle --no-daemon :composeApp:wasmJsBrowserDistribution 2>&1 | tee ../registro-kmp.txt

      - name: Publicar el registro de errores
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |What went wrong|FAILED|> " registro-kmp.txt | head -80 | while IFS= read -r l; do echo "::error::$l"; done || true
          gh release view revista-kmp-registro --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create revista-kmp-registro --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Registro · Revista nativa" --notes "Registro de la última compilación fallida."
          gh release upload revista-kmp-registro registro-kmp.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Capturas
        run: |
          D=composeApp/build/dist/wasmJs/productionExecutable
          ls -la $D
          (cd $D && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium firefox
          node capturas.js
          ls capturas

      - name: Publicar capturas y paquete en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd composeApp/build/dist/wasmJs/productionExecutable && zip -qr $GITHUB_WORKSPACE/revista-nativa.zip .)
          gh release view revista-kmp --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create revista-kmp --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Revista nativa (Kotlin)" --notes "Prototipo de la Revista hecha en Kotlin. Se abre en https://arielegno.github.io/Radio/revista-nativa/"
          gh release upload revista-kmp capturas/*.png capturas/consola.txt $GITHUB_WORKSPACE/revista-nativa.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publicar en la web (carpeta revista-nativa/ de main)
        working-directory: .
        run: |
          git fetch -q origin main
          git worktree add -q sitio origin/main
          rm -rf sitio/revista-nativa && mkdir -p sitio/revista-nativa
          cp -r revista-kmp/composeApp/build/dist/wasmJs/productionExecutable/. sitio/revista-nativa/
          cd sitio
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A revista-nativa
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Revista nativa: nueva versión"
          git push -q origin HEAD:main
