<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio de ruta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1b1e23; --panel:#262a31; --line:#f2c230; --sign:#1b4f9c; --signtext:#f4f6f8;
  --text:#e6e9ed; --muted:#8d96a3; --alert:#e5604d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--asphalt);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:17px;line-height:1.45}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;margin:4px 0 16px;letter-spacing:.01em}

/* Cartel de ruta: lo memorable de la pantalla */
.sign{background:var(--sign);color:var(--signtext);border:3px solid var(--signtext);border-radius:10px;
  outline:3px solid var(--sign);outline-offset:3px;padding:14px 16px 16px;margin:0 3px 22px}
.sign small{display:block;font-size:14px;opacity:.85}
.sign strong{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1.1;margin-top:2px;word-break:break-word}

.now{border-left:5px solid var(--line);padding:2px 0 2px 14px;margin-bottom:18px}
.now .t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;line-height:1.15}
.now .a{color:var(--muted)}
.next{color:var(--muted);margin:0 0 18px}
.next b{color:var(--text);font-weight:500}

.voice{background:var(--panel);border-radius:10px;padding:14px 16px;min-height:96px;margin-bottom:18px;color:var(--text)}
.voice.live{box-shadow:inset 0 0 0 2px var(--line)}
.voice .who{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--line);font-size:18px;margin-bottom:4px}
.voice p{margin:0}

.status{color:var(--muted);font-size:15px;min-height:22px;margin-bottom:14px}
.status.err{color:var(--alert)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
button{font:inherit;font-weight:500;border:0;border-radius:8px;padding:13px 18px;background:var(--line);color:#1b1e23;min-height:48px;cursor:pointer}
button.alt{background:var(--panel);color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--signtext);outline-offset:2px}
button[hidden]{display:none}

details{background:var(--panel);border-radius:10px;padding:4px 16px}
summary{padding:12px 0;font-weight:500;cursor:pointer}
label{display:block;margin:12px 0 4px;color:var(--muted);font-size:15px}
input,select{width:100%;font:inherit;background:var(--asphalt);color:var(--text);border:1px solid #3a404a;border-radius:8px;padding:11px 12px;min-height:46px}
.hint{font-size:14px;color:var(--muted);margin:6px 0 14px}
code{background:var(--asphalt);padding:1px 5px;border-radius:4px;font-size:14px;word-break:break-all}
</style>
</head>
<body>
<h1>Radio de ruta</h1>

<div class="sign" aria-live="polite">
  <small>Cerca de</small>
  <strong id="place">Esperando ubicación</strong>
</div>

<div class="now">
  <div class="t" id="title">Nada sonando</div>
  <div class="a" id="artist">Pon música en Spotify</div>
</div>
<p class="next" id="next" hidden>Sigue: <b id="nextName"></b></p>

<div class="voice" id="voiceBox" aria-live="polite">
  <div class="who" id="hostLabel">Locutora</div>
  <p id="script">Aquí aparecerá lo que diga entre canciones.</p>
</div>

<div class="status" id="status" role="status"></div>

<div class="row">
  <button id="login">Conectar con Spotify</button>
  <button id="start" hidden>Iniciar radio</button>
  <button id="test" class="alt">Probar voz</button>
</div>

<details id="settings">
  <summary>Ajustes</summary>

  <label for="clientId">Client ID de Spotify</label>
  <input id="clientId" data-k="clientId" autocomplete="off" autocapitalize="off" spellcheck="false">

  <label for="provider">Quién escribe los textos</label>
  <select id="provider" data-k="provider">
    <option value="gemini">Gemini (gratis)</option>
    <option value="claude">Claude (de pago)</option>
  </select>

  <label for="geminiKey">API key de Gemini</label>
  <input id="geminiKey" data-k="geminiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">

  <label for="geminiModel">Modelo de Gemini</label>
  <input id="geminiModel" data-k="geminiModel" value="gemini-2.5-flash" autocapitalize="off" spellcheck="false">

  <label for="apiKey">API key de Anthropic</label>
  <input id="apiKey" data-k="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="hint">Se guarda solo en este celular. Úsala únicamente en tu propio dispositivo.</p>

  <label for="model">Modelo de Claude</label>
  <input id="model" data-k="model" value="claude-sonnet-5-5" autocapitalize="off" spellcheck="false">

  <label for="host">Nombre de la locutora</label>
  <input id="host" data-k="host" value="Luna">

  <label for="wEvery">Hora y clima cada cuántas intervenciones</label>
  <input id="wEvery" data-k="wEvery" type="number" min="1" max="20" value="3">

  <label for="pEvery">Zona o ruta cada cuántas intervenciones</label>
  <input id="pEvery" data-k="pEvery" type="number" min="1" max="20" value="2">

  <label for="voice">Voz</label>
  <select id="voice" data-k="voice"></select>

  <p class="hint">Redirect URI que debes registrar en Spotify: <code id="redir"></code></p>
</details>

<script>
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d = '') { try { const v = localStorage.getItem('rr_' + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rr_' + k, v); } catch {} }
};
const redirectUri = location.origin + location.pathname;
$('redir').textContent = redirectUri;

/* ---------- Ajustes ---------- */
document.querySelectorAll('[data-k]').forEach(el => {
  const saved = store.get(el.dataset.k, null);
  if (saved !== null && el.id !== 'voice') el.value = saved;
  el.addEventListener('change', () => { store.set(el.dataset.k, el.value); if (el.id === 'host') $('hostLabel').textContent = el.value; });
});
$('hostLabel').textContent = $('host').value || 'Locutora';
const setting = (id, d) => ($(id).value || '').trim() || d;

function status(msg, err = false) { const s = $('status'); s.textContent = msg; s.classList.toggle('err', err); }

/* ---------- Spotify (PKCE, sin servidor) ---------- */
const SCOPES = 'user-read-playback-state user-modify-playback-state';
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
  const clientId = setting('clientId', '');
  if (!clientId) { $('settings').open = true; return status('Falta el Client ID de Spotify en Ajustes.', true); }
  store.set('clientId', clientId);
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  store.set('verifier', verifier);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    client_id: clientId, response_type: 'code', redirect_uri: redirectUri,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: store.get('clientId'), ...params })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || 'Error de Spotify');
  store.set('access', j.access_token);
  store.set('exp', String(Date.now() + j.expires_in * 1000 - 60000));
  if (j.refresh_token) store.set('refresh', j.refresh_token);
}
async function handleRedirect() {
  const code = new URLSearchParams(location.search).get('code');
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  try {
    await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: redirectUri, code_verifier: store.get('verifier') });
  } catch (e) { status('No se pudo conectar: ' + e.message, true); }
}
async function token() {
  if (Date.now() > Number(store.get('exp', '0'))) await tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('refresh') });
  return store.get('access');
}
async function spot(path, method = 'GET') {
  const r = await fetch('https://api.spotify.com/v1' + path, { method, headers: { Authorization: 'Bearer ' + await token() } });
  if (r.status === 204 || r.status === 202) return null;
  if (!r.ok) throw new Error('Spotify ' + r.status + (r.status === 403 ? ' (se necesita Premium)' : ''));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

/* ---------- Ubicación, zona y clima ---------- */
let pos = null;
function startGeo() {
  if (!navigator.geolocation) return status('Este navegador no tiene ubicación.', true);
  navigator.geolocation.watchPosition(
    p => { pos = { lat: p.coords.latitude, lon: p.coords.longitude, heading: p.coords.heading }; },
    () => status('Sin permiso de ubicación: no se mencionará la ruta ni el clima.', true),
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
}
const CARD = ['norte', 'noreste', 'este', 'sureste', 'sur', 'suroeste', 'oeste', 'noroeste'];
let placeCache = { t: 0, text: '' };
async function getPlace() {
  if (!pos) return null;
  if (Date.now() - placeCache.t < 45000 && placeCache.text) return placeCache.text;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=es&lat=${pos.lat}&lon=${pos.lon}`);
    const a = (await r.json()).address || {};
    const road = a.road || a.pedestrian || a.highway;
    const area = a.neighbourhood || a.suburb || a.city_district;
    const city = a.city || a.town || a.village || a.municipality;
    const text = [road, area, city].filter((v, i, arr) => v && arr.indexOf(v) === i).join(', ');
    if (text) { placeCache = { t: Date.now(), text }; $('place').textContent = text; }
    return text || null;
  } catch { return null; }
}
function heading() {
  return pos && typeof pos.heading === 'number' && !isNaN(pos.heading) ? CARD[Math.round(pos.heading / 45) % 8] : null;
}
function wmo(c) {
  if (c === 0) return 'despejado';
  if (c <= 2) return 'parcialmente nublado';
  if (c === 3) return 'nublado';
  if (c === 45 || c === 48) return 'con niebla';
  if (c >= 51 && c <= 57) return 'con llovizna';
  if (c >= 61 && c <= 67) return 'con lluvia';
  if (c >= 71 && c <= 77) return 'con nieve';
  if (c >= 80 && c <= 82) return 'con chubascos';
  if (c >= 95) return 'con tormenta';
  return 'variable';
}
async function getWeather() {
  if (!pos) return null;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.lat}&longitude=${pos.lon}&current=temperature_2m,weather_code&timezone=auto`);
    const c = (await r.json()).current;
    return `${Math.round(c.temperature_2m)} grados, ${wmo(c.weather_code)}`;
  } catch { return null; }
}

/* ---------- Claude escribe la intervención ---------- */
async function writeScript(prev, next, extras, history) {
  const host = setting('host', 'Luna');
  const system =
`Eres ${host}, locutora de una radio personal que acompaña a una persona mientras viaja. Hablas en español neutro, cercano y relajado, como en una radio FM de noche.
Tu texto se lee en voz alta: sin emojis, sin markdown, sin listas, sin paréntesis; escribe horas y números como se dicen.
Entre 50 y 90 palabras. Cierra la canción que terminó con un dato curioso del artista o del disco y presenta la que viene.
Si realmente sabes que ambos artistas colaboraron, compartieron escenario o festival, o tienen una conexión clara, cuéntalo. Si no estás segura, no lo inventes ni lo insinúes.
Afirma solo datos de los que estés muy segura. Si no tienes uno bueno, comenta el estilo o la época de forma general.
Si te doy hora, clima o lugar, menciónalos de forma natural y breve, sin añadir nada que no esté en los datos. Si no te los doy, no los menciones.
Nunca digas que eres una IA y nunca menciones la velocidad. No repitas ideas de tus intervenciones anteriores.
Responde solo con el texto a leer.`;
  const user = JSON.stringify({
    cancion_que_termino: prev, cancion_que_viene: next, ...extras,
    intervenciones_anteriores: history
  });
  if (setting('provider', 'gemini') === 'gemini') {
    const g = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${setting('geminiModel', 'gemini-2.5-flash')}:generateContent`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': setting('geminiKey', '') },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: 'user', parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: 1500 }
      })
    });
    const gj = await g.json();
    if (!g.ok) throw new Error(gj.error?.message || 'Error de Gemini');
    return (gj.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join(' ').trim();
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': setting('apiKey', ''),
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: setting('model', 'claude-sonnet-5-5'), max_tokens: 400, system, messages: [{ role: 'user', content: user }] })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || 'Error de Claude');
  return j.content.filter(b => b.type === 'text').map(b => b.text).join(' ').trim();
}

/* ---------- Voz ---------- */
function loadVoices() {
  const sel = $('voice');
  const es = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('es'));
  if (!es.length) return;
  const saved = store.get('voice', '');
  const rank = v => /natural|premium|enhanced|google/i.test(v.name) ? 0 : 1;
  es.sort((a, b) => rank(a) - rank(b));
  sel.innerHTML = es.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  sel.value = es.some(v => v.name === saved) ? saved : es[0].name;
}
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }

function speak(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const voice = speechSynthesis.getVoices().find(v => v.name === $('voice').value);
    const sentences = text.match(/[^.!?¿]+[.!?]*/g) || [text];
    const chunks = [];
    let cur = '';
    for (const s of sentences) {
      if ((cur + s).length > 170 && cur) { chunks.push(cur); cur = s; } else cur += s;
    }
    if (cur.trim()) chunks.push(cur);
    let i = 0;
    const safety = setTimeout(resolve, 120000);
    const next = () => {
      if (i >= chunks.length) { clearTimeout(safety); return resolve(); }
      const u = new SpeechSynthesisUtterance(chunks[i++].trim());
      u.lang = voice?.lang || 'es-ES';
      if (voice) u.voice = voice;
      u.rate = 1;
      u.onend = next;
      u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}

/* ---------- Pantalla encendida ---------- */
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });

/* ---------- Bucle de la radio ---------- */
const S = { track: null, at: 0, prog: 0, dur: 0, playing: false, state: 'idle', breakNo: 0, script: null, next: null, history: [] };
let running = false, polling = false;

function render() {
  $('title').textContent = S.track ? S.track.name : 'Nada sonando';
  $('artist').textContent = S.track ? S.track.artists.map(a => a.name).join(', ') + ' · ' + S.track.album.name : 'Pon música en Spotify';
  $('next').hidden = !S.next;
  if (S.next) $('nextName').textContent = S.next.name + ' — ' + S.next.artists.map(a => a.name).join(', ');
}
const info = t => ({ titulo: t.name, artistas: t.artists.map(a => a.name), album: t.album.name, ano: (t.album.release_date || '').slice(0, 4) });

async function poll() {
  if (polling) return;
  polling = true;
  try {
    const d = await spot('/me/player');
    S.at = Date.now();
    if (!d || !d.item || d.currently_playing_type !== 'track') {
      S.playing = false;
      status('Abre Spotify en este celular y pon un álbum o playlist.');
      return;
    }
    S.prog = d.progress_ms; S.dur = d.item.duration_ms; S.playing = d.is_playing;
    if (!S.track || S.track.id !== d.item.id) {
      S.track = d.item; S.next = null; S.script = null;
      if (S.state !== 'break') S.state = 'playing';
      render();
    }
    if (S.state !== 'break') status(S.playing ? 'Radio en el aire.' : 'En pausa.');
  } catch (e) { status(e.message, true); }
  finally { polling = false; }
}

async function prepare() {
  const id = S.track.id;
  const q = await spot('/me/player/queue');
  const next = (q?.queue || []).find(t => t.type === 'track');
  if (!next) { S.state = 'skip'; return; }
  S.breakNo++;
  const n = S.breakNo;
  const extras = {};
  if ((n - 1) % Number(setting('wEvery', 3)) === 0) {
    extras.hora_local = new Date().toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' });
    const w = await getWeather();
    if (w) extras.clima = w;
  }
  if ((n - 1) % Number(setting('pEvery', 2)) === 0) {
    const p = await getPlace();
    if (p) { extras.lugar_cercano = p; const h = heading(); if (h) extras.rumbo = h; }
  }
  const script = await writeScript(info(S.track), info(next), extras, S.history);
  if (!S.track || S.track.id !== id) return;
  S.next = next; S.script = script; S.state = 'ready';
  render();
}

async function doBreak() {
  S.state = 'break';
  const script = S.script;
  $('voiceBox').classList.add('live');
  $('script').textContent = script;
  status('Locutora al aire.');
  try {
    await spot('/me/player/pause', 'PUT');
    await speak(script);
    await spot('/me/player/next', 'POST');
    await new Promise(r => setTimeout(r, 700));
    await spot('/me/player/play', 'PUT').catch(() => {});
  } catch (e) { status(e.message, true); }
  S.history = [...S.history, script].slice(-4);
  S.script = null; S.at = 0; S.state = 'playing';
  $('voiceBox').classList.remove('live');
  await poll();
}

async function tick() {
  if (!running || S.state === 'break') return;
  if (Date.now() - S.at > 2000) await poll();
  if (!S.track || !S.playing) return;
  const remaining = S.dur - (S.prog + Date.now() - S.at);
  if (remaining < 35000 && S.state === 'playing') {
    S.state = 'writing';
    prepare().catch(e => { S.state = 'skip'; status(e.message, true); });
  }
  if (remaining < 3000 && S.state === 'ready') doBreak();
}

/* ---------- Botones ---------- */
$('login').onclick = login;
$('test').onclick = () => speak(`Hola, soy ${setting('host', 'Luna')}. Así voy a sonar entre canciones.`);
$('start').onclick = async () => {
  const usingGemini = setting('provider', 'gemini') === 'gemini';
  if (!setting(usingGemini ? 'geminiKey' : 'apiKey', '')) { $('settings').open = true; return status('Falta la API key de ' + (usingGemini ? 'Gemini' : 'Anthropic') + ' en Ajustes.', true); }
  $('start').hidden = true;
  running = true;
  startGeo();
  keepAwake();
  setInterval(() => { if (pos) getPlace(); }, 30000);
  setInterval(tick, 700);
  status('Radio lista. Pon música en Spotify.');
  speak(`Hola, soy ${setting('host', 'Luna')}. Empezamos.`);
};

(async function init() {
  await handleRedirect();
  const connected = !!store.get('refresh');
  $('login').hidden = connected;
  $('start').hidden = !connected;
  status(connected ? 'Spotify conectado.' : 'Primero conecta Spotify (necesitas Premium).');
})();
</script>
</body>
</html>
